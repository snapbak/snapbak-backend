<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>$title · Snapbak</title>
<meta name="description" content="$summary">
<meta property="og:type" content="video.other">
<meta property="og:site_name" content="Snapbak">
<meta property="og:title" content="$title">
<meta property="og:description" content="$summary">
<meta property="og:url" content="$page_url">
$image_tags<meta property="og:video" content="$page_url/video.mp4">
<meta property="og:video:secure_url" content="$page_url/video.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="$width">
<meta property="og:video:height" content="$height">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="$title">
<link rel="icon" href="$icon">
<style>
$tokens
$style
body {
  /* One column for the brand, the player and the title: as wide as the window allows, but the player never taller
     than the window leaves room for beside the header, title and footer, so the video has no bars and nothing
     scrolls on a 1100 x 720 window. */
  --column: min(1080px, 100% - var(--sb-spacing-8), max(280px, calc((100dvh - 300px) * var(--w) / var(--h))));
}
.bar,
main {
  width: var(--column);
}
.player {
  aspect-ratio: var(--w) / var(--h);
  overflow: hidden;
  border-radius: var(--sb-radius-lg);
  border: 1px solid var(--sb-color-border);
  background: var(--sb-color-surface);
  box-shadow:
    0 40px 100px -36px color-mix(in srgb, var(--sb-color-accent) 55%, transparent),
    0 0 0 1px var(--sb-color-glass);
}
video {
  display: block;
  width: 100%;
  height: 100%;
}
.meta {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: var(--sb-spacing-4);
  margin-top: var(--sb-spacing-6);
}
h1 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  font-size: clamp(var(--sb-font-size-lg), 2.4vw, var(--sb-font-size-xl));
}
.sub {
  margin: var(--sb-spacing-1) 0 0;
  color: var(--sb-color-text-muted);
  font-size: var(--sb-font-size-sm);
  font-variant-numeric: tabular-nums;
}
@media (max-width: 560px) {
  .meta {
    grid-template-columns: 1fr;
  }
  .meta .button {
    justify-content: center;
  }
}
</style>
</head>
<body style="--w: $width; --h: $height">
<header class="bar"><a class="brand" href="$home_url?ref=share">$mark<span>Snapbak</span></a></header>
<main>
<div class="player"><video controls playsinline preload="metadata"$poster_attr width="$width" height="$height" src="$video_url"></video></div>
<div class="meta">
<div>
<h1 title="$title">$title</h1>
<p class="sub"><time datetime="$created_iso">$created_text</time> · $duration</p>
</div>
<a class="button" href="$page_url/download"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Download</a>
</div>
</main>
<footer><a href="$home_url?ref=share"><strong>Made with Snapbak</strong> · <span>Get Snapbak →</span></a></footer>
<script>$script</script>
</body>
</html>
